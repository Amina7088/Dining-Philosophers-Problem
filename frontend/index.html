
<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dining Philosophers Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Dining Philosophers</h1>
      <p>Философичдын хооллох асуудлын симулятор</p>
    </header>

    <section class="controls">
      <label>
        Философичдын тоо (N)
        <input id="count" type="number" min="2" max="10" value="5">
      </label>

      <label>
        Бодох хугацаа (секунд)
        <input id="thinkTime" type="number" min="1" max="10" value="1">
      </label>

      <label>
        Хооллох хугацаа (секунд)
        <input id="eatTime" type="number" min="1" max="10" value="2">
      </label>

      <div class="buttons">
        <button id="start">Start</button>
        <button id="pause" disabled>Pause</button>
        <button id="reset">Reset</button>
      </div>
    </section>

    <section class="simulation">
      <h2>Философичдын төлөв</h2>
      <div id="philosophers"></div>
    </section>

    <section class="legend">
      <span><i class="dot thinking-dot"></i> Thinking</span>
      <span><i class="dot hungry-dot"></i> Hungry</span>
      <span><i class="dot eating-dot"></i> Eating</span>
    </section>

    <p id="status" role="status">Симуляци эхлүүлэхэд бэлэн.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
